name: UTD finish runtime once

on:
  push:
    paths:
      - '.github/workflows/utd-finish-runtime-once.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Integrate watch feedback and task truth
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/bot/bot.py')
          s=p.read_text()
          old='_PRM_CALLBACK_PREFIXES = ("prma:", "prmc:", "utdp:", "utdc:")'
          new='_PRM_CALLBACK_PREFIXES = ("prma:", "prmc:", "utdp:", "utdc:", "utdw:")'
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('src/bot/callbacks.py')
          s=p.read_text()
          s=s.replace('import logging\nimport sqlite3\n', 'import logging\nimport os\nimport sqlite3\n')
          anchor='from config.settings import Settings\n'
          inject='from config.settings import Settings\nfrom external_watch.delivery import FEEDBACK_PREFIX as UTD_WATCH_FEEDBACK_PREFIX, handle_feedback_callback as handle_utd_watch_feedback_callback\n'
          assert anchor in s
          s=s.replace(anchor, inject, 1)
          anchor='    if callback_data.startswith(\n        (f"{UTD_DRAFT_PREFIX}:", f"{UTD_CONFIRM_PREFIX}:")\n    ):\n        return handle_utd_profile_callback(settings.db_path, callback_data, chat_id=chat_id)\n'
          inject='    if callback_data.startswith(f"{UTD_WATCH_FEEDBACK_PREFIX}:"):\n        sidecar = os.environ.get("UTD_WATCH_SIDECAR_DB", "data/private/utd_watch_shadow.db")\n        return handle_utd_watch_feedback_callback(sidecar, callback_data)\n'+anchor
          assert anchor in s
          p.write_text(s.replace(anchor,inject,1))

          p=Path('tools/test_tiers.py')
          s=p.read_text()
          anchor='    "tests/test_external_watch_relevance.py",\n'
          repl=anchor+'    "tests/test_external_watch_delivery.py",\n    "tests/test_external_watch_calibration.py",\n'
          assert anchor in s
          s=s.replace(anchor,repl)
          p.write_text(s)

          p=Path('docs/tasks.md')
          s=p.read_text()
          s=s.replace('### UTD-5: Shadow Quality Review And Notification Gate\n\nOwner:      human operator + codex\nPhase:      validation\nType:       eval:gate\nDepends-On: UTD-4\nStatus:     blocked_pending_shadow_evidence', '### UTD-5: Shadow Quality Review And Notification Gate\n\nOwner:      human operator + codex\nPhase:      validation\nType:       eval:gate\nDepends-On: UTD-4\nStatus:     implemented_pending_live_operator_metrics')
          s=s.replace('### UTD-6: Unified Bot ASK And Confirmed Low-volume WATCH\n\nOwner:      codex + human operator\nPhase:      controlled-delivery\nType:       agent:harness privacy\nDepends-On: UTD-DR-2\nStatus:     blocked_pending_delivery_approval', '### UTD-6: Unified Bot ASK And Confirmed Low-volume WATCH\n\nOwner:      codex + human operator\nPhase:      controlled-delivery\nType:       agent:harness privacy\nDepends-On: UTD-DR-2\nStatus:     implemented_default_off_pending_live_enablement')
          s=s.replace('### UTD-7: Personal Relevance Calibration\n\nOwner:      human operator + codex\nPhase:      iteration\nType:       eval:gate\nDepends-On: UTD-6\nStatus:     blocked_pending_live_feedback', '### UTD-7: Personal Relevance Calibration\n\nOwner:      human operator + codex\nPhase:      iteration\nType:       eval:gate\nDepends-On: UTD-6\nStatus:     implemented_pending_live_feedback')
          p.write_text(s)
          PY
          git rm .github/workflows/utd-finish-runtime-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot/bot.py src/bot/callbacks.py tools/test_tiers.py docs/tasks.md
          git commit -m 'feat(utd): wire feedback runtime and finalize task truth'
          git push
