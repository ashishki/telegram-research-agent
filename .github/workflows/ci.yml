name: CI

on:
  push:
    branches: ["master", "main", "refactor/**"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  test:
    name: Focused PRM and retrofit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused PRM tests
        run: python tools/test_tiers.py focused-prm
      - name: Verify retrofit boundaries
        run: python tools/test_tiers.py retrofit-boundaries
      - name: Run MAT safety holdouts
        run: python tools/prm_mat_eval.py --check safety
      - name: Validate PA approval guard and Playbook task contracts
        # In the deliberately unapproved PA planning state this command accepts
        # only the exact, complete set of design-approval errors.  Once the
        # design is formally approved it delegates to the upstream validator
        # and fails on any task/reference error.
        run: python tools/check_pa_approval_guard.py
      - name: Verify public evidence boundary
        run: PYTHONPATH=src python3 scripts/public_scorecard_demo.py --check
