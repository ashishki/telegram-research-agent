name: Playbook adoption and PA plan

on:
  push:
    branches: ["docs/personal-assistant-blueprint-playbook-20260918", "master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install development checks
        run: python -m pip install -r requirements-playbook.txt
      - name: Verify immutable upstream pin
        run: python tools/playbook.py --check-pin
      - name: Bridge and expected-rejection tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_playbook_bridge.py tests/test_pa_approval_guard.py -q
      - name: Validate complete PA plan
        run: python tools/check_personal_assistant_plan.py
      - name: Verify unapproved design remains blocked (planning only)
        run: python tools/check_pa_approval_guard.py
      - name: Current workflow entrypoints smoke
        run: |
          python tools/feature_workflow.py --help
          python tools/run_codex_role.py --help
          python tools/render_slice_context.py --help
      - name: Whitespace diff check
        run: git diff --check HEAD^ HEAD
