name: UTD final cleanup once

on:
  push:
    paths:
      - '.github/workflows/utd-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Finalize UTD task truth and remove one-shot network workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/tasks.md')
          text=p.read_text(encoding='utf-8')
          old='''Notes: |\n  UTD-1 introduces no live UTD fetch, timer, Telegram notification, dogfood run,\n  production DB migration or external web job. UTD-2 and UTD-3 remain operator\n  evidence work. UTD-DR-1 remains planned until UTD-1/2/3 are all complete.'''
          new='''Notes: |\n  UTD-1 remains the confirmed one-bot profile/watch contract. Subsequent work has\n  added sanitized live source evidence and a bounded shadow collector without\n  changing UTD-1 confirmation semantics, production DB boundaries or Telegram\n  delivery. Human evaluation labels remain a later quality gate.'''
          if text.count(old) != 1: raise SystemExit('UTD-1 notes marker mismatch')
          text=text.replace(old,new)
          old='''### UTD-5: Shadow Quality Review And Notification Gate\n\nOwner:      human operator + codex\nPhase:      validation\nType:       eval:gate\nDepends-On: UTD-4\nStatus:     blocked_pending_shadow_evidence'''
          new='''### UTD-5: Shadow Quality Review And Notification Gate\n\nOwner:      human operator + codex\nPhase:      validation\nType:       eval:gate\nDepends-On: UTD-4\nStatus:     blocked_pending_human_quality_labels'''
          if text.count(old) != 1: raise SystemExit('UTD-5 status marker mismatch')
          text=text.replace(old,new)
          marker='''Verification:\n  - private shadow metrics receipt and operator approval for limited delivery\n\nFiles:\n  - data/evals/private/\n  - docs/audit/'''
          replacement='''Verification:\n  - private shadow metrics receipt and operator approval for limited delivery\n\nNotes: |\n  Bounded technical shadow evidence now exists: the final live probe saw 102\n  source items, 32 relevant changes and five capped predicted candidates, then\n  zero changes/candidates on an identical second poll. This does not establish\n  precision/recall or delivery readiness; those require genuine human labels.\n\nFiles:\n  - data/evals/private/\n  - docs/audit/'''
          if text.count(marker) != 1: raise SystemExit('UTD-5 notes marker mismatch')
          text=text.replace(marker,replacement)
          p.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/utd-shadow-capture-once.yml
          rm -f .github/workflows/utd-shadow-probe-once.yml
          rm -f .github/workflows/utd-finalize-once.yml
          python tools/playbook_validate.py --root . --check tasks --check references
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasks.md .github/workflows/
          git commit -m 'docs(utd): finalize shadow task truth and remove one-shot jobs'
          git push origin HEAD:master
